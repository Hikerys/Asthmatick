apply plugin: 'com.android.application'

android {
    namespace = "app.asthma.tick"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.asthma.tick"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    bundle { language { enableSplit = false } }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets { main { assets.srcDirs = [] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            if (file('asthmatick-release.keystore').exists()) {
                storeFile file('asthmatick-release.keystore')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "asthmatick2026"
                keyAlias System.getenv("KEY_ALIAS") ?: "asthmatick"
                keyPassword System.getenv("KEY_PASSWORD") ?: "asthmatick2026"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    buildTypes {
        release {
            if (file('asthmatick-release.keystore').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.activity:activity:1.11.0"

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.14.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
